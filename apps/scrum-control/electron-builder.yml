appId: solutions.aidu.scrum-control
productName: Scrum Control
copyright: MIT

directories:
  output: release
  buildResources: assets

files:
  - out/**/*
  - package.json
  - assets/icons/**/*

# The toast XML path (D6, src/main/icon-assets.ts:toastIconUri) hands Windows a `file:///` URI
# it opens itself, which cannot reach into `app.asar` — only the patched `fs` can. Unpacking the
# icon art keeps it reachable by plain file path at `app.asar.unpacked/assets/icons/**` in the
# packaged portable build.
asarUnpack:
  - assets/icons/**/*

# N3: portable EXE, started manually. No installer; autostart is an opt-in setting.
win:
  target:
    - portable
  icon: assets/icons/app.ico
  # No electron-updater channel: the opt-in self-update (src/main/selfUpdate.ts) downloads the
  # portable EXE itself from the repository's `scrum-control-v*` GitHub releases.

portable:
  artifactName: ScrumControl-${version}-portable.exe
  requestExecutionLevel: user
  unpackDirName: false

# No publish target: electron-builder uploads nothing; the release workflow publishes the EXE.
publish: null
